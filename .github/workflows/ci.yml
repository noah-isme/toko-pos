name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Supersede in-flight runs for the same ref: this job provisions Postgres,
# builds, and drives a browser suite, so stacked runs on rapid pushes are
# expensive and only the newest result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this a wedged browser test would hold a runner for the 6h default.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Version comes from package.json "packageManager". Pinning 8 here while
      # pnpm-lock.yaml is lockfileVersion 9.0 meant pnpm could not read the
      # lockfile, which is why installs had to run --no-frozen-lockfile and
      # silently re-resolved every dependency instead of using locked versions.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store and Prisma artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm
            ~/.pnpm-store
            .pnpm-store
            node_modules/.pnpm
            node_modules
            .prisma
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Approve pnpm build scripts
        run: pnpm approve-builds || true

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 && break || sleep 1
          done

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: pnpm run db:push

      - name: Seed database
        # seed:full rather than seed-initial.mjs. The login specs
        # (auth-credentials, ui/login) need owner@example.com with the password
        # "password", which both scripts provide, but the rest of the suite also
        # needs catalogue and transaction data: seed-initial.mjs creates only
        # users, outlets and daily summaries, so the products, audit-log and
        # owner-dashboard specs failed on missing categories, activity logs and
        # sales.
        #
        # seed-full.mjs truncates every table before rebuilding (clearAllTables).
        # That is safe here because the Postgres service container is created
        # fresh for each run, but it is why this must never be pointed at a
        # database that holds anything worth keeping.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
        run: pnpm run seed:full

      - name: Run lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: pnpm run test:unit

      # Cache the browser binaries; `playwright install` skips the download when
      # they are already present, so the step still runs to install OS deps.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # Only chromium: playwright.config.ts defines no other project.
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        # Blocking gate: the E2E suite was repaired in the e2e-repair pass and is
        # now green in CI (13/13 on ephemeral Postgres). Previously non-blocking
        # because it had been failing on main since Oct 2025; that debt is paid,
        # so E2E now gates merges alongside lint, typecheck, build and unit tests.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: pnpm exec playwright test --project=chromium --reporter=list

      - name: Run visual regression tests (Playwright)
        # Separate from the E2E step because visual specs need the session
        # bypass OFF (NEXT_PUBLIC_E2E=false) so pages render as the admin the
        # specs authenticate as; playwright.config.ts excludes them from the
        # default suite for the same reason. Before this step the visual suite
        # never executed in CI at all — the module-level test.skip guards saw no
        # PLAYWRIGHT_VISUAL_AUTH and skipped all 20 authenticated tests.
        #
        # Non-blocking for now: the committed baselines were recorded on a
        # developer machine whose font stack differs from ubuntu-latest, so
        # text-heavy pages will diff on antialiasing alone. Diffs upload as
        # artifacts below. Make this blocking once baselines are regenerated in
        # this environment (see README / DOCS_INDEX for the procedure).
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: pnpm run test:e2e:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
